# ==============================================================================
# Jenkins Wrapper Helm Values (Production-Grade GitOps Pattern B)
# Reference: github.com/nubenetes/jenkins-backstage-gitops-patterns
# ==============================================================================

jenkins:
  controller:
    componentName: "jenkins-controller"
    image:
      registry: "docker.io"
      repository: "jenkins/jenkins"
      tag: "lts-jdk21"
      pullPolicy: "IfNotPresent"

    resources:
      requests:
        cpu: "1000m"
        memory: "2048Mi"
      limits:
        cpu: "2000m"
        memory: "4096Mi"

    javaOpts: "-Djenkins.install.runSetupWizard=false -Dorg.apache.commons.jelly.tags.core.expr.InstantExpr=false -Djava.awt.headless=true"

    # Pre-installed Plugins required for JCasC, Job DSL, Kubernetes agents, RBAC, and Observability
    installPlugins:
      - "configuration-as-code:1775.v810dc950b_514"
      - "job-dsl:1.89"
      - "kubernetes:4293.v750058b_4550e"
      - "workflow-aggregator:600.vb_57cdd26fdd7"
      - "git:5.2.2"
      - "git-client:4.7.0"
      - "pipeline-stage-view:2.34"
      - "sonar:2.17.2"
      - "ansicolor:1.0.4"
      - "credentials-binding:687.v6196d06e39fc"
      - "timestamper:1.26"
      - "pipeline-utility-steps:2.16.0"
      - "matrix-auth:3.2.2"
      - "opentelemetry:2.17.0"

    # Jenkins Configuration as Code (JCasC) definitions
    JCasC:
      enabled: true
      defaultConfig: true
      configScripts:
        welcome-message: |
          jenkins:
            systemMessage: "🚀 NubeNetes Enterprise CI/CD - GitOps Pattern B (Centralized Seed Job + Backstage Scaffolder)"
        security-config: |
          jenkins:
            securityRealm:
              local:
                allowsSignup: false
                users:
                  - id: "admin"
                    password: "${JENKINS_ADMIN_PASSWORD:-admin123456}"
            authorizationStrategy:
              projectMatrix:
                permissions:
                  - "Overall/Administer:admin"
                  - "Overall/Administer:group:platform-engineering"
                  - "Overall/Read:authenticated"
                  - "View/Read:authenticated"
                  - "Item/Read:authenticated"
            remotingSecurity:
              enabled: true
        observability-config: |
          unclassified:
            openTelemetry:
              endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector.monitoring.svc:4317}"
              exportOtelConfigurationAsEnvironmentVariables: true
        kubernetes-agents: |
          jenkins:
            clouds:
              - kubernetes:
                  name: "kubernetes"
                  serverUrl: "https://kubernetes.default.svc"
                  namespace: "jenkins-ci"
                  jenkinsUrl: "http://jenkins.jenkins-ci.svc.cluster.local:8080"
                  jenkinsTunnel: "jenkins-agent.jenkins-ci.svc.cluster.local:50000"
                  containerCapStr: "50"
                  templates:
                    - name: "jhipster-builder-agent"
                      label: "jhipster-builder"
                      nodeUsageMode: "EXCLUSIVE"
                      idleMinutes: 5
                      serviceAccount: "jenkins-agent"
                      containers:
                        - name: "jnlp"
                          image: "jenkins/inbound-agent:3283.v92c105e0f819-1-jdk21"
                          privileged: false
                          alwaysPullImage: false
                          workingDir: "/home/jenkins/agent"
                          resourceRequestCpu: "200m"
                          resourceRequestMemory: "256Mi"
                          resourceLimitCpu: "500m"
                          resourceLimitMemory: "512Mi"
                        - name: "maven"
                          image: "maven:3.9.9-eclipse-temurin-21-alpine"
                          workingDir: "/home/jenkins/agent"
                          command: "sleep"
                          args: "99d"
                          resourceRequestCpu: "500m"
                          resourceRequestMemory: "1024Mi"
                          resourceLimitCpu: "2000m"
                          resourceLimitMemory: "2048Mi"
                        - name: "kaniko"
                          image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                          workingDir: "/home/jenkins/agent"
                          command: "sleep"
                          args: "99d"
                          resourceRequestCpu: "500m"
                          resourceRequestMemory: "512Mi"
                          resourceLimitCpu: "1500m"
                          resourceLimitMemory: "1024Mi"
        seed-jobs: |
          jobs:
            - script: >
                pipelineJob('Seed_Job_Pattern_B') {
                  displayName('🌱 Centralized GitOps Seed Job (Pattern B)')
                  description('Reads inventories (dev.yaml, pre.yaml, pro.yaml) and SharedJenkinsfile template to provision all pipelines dynamically.')
                  logRotator {
                    numToKeep(20)
                    daysToKeep(30)
                  }
                  triggers {
                    scm('H/5 * * * *')
                  }
                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('https://github.com/nubenetes/jenkins-backstage-gitops-patterns.git')
                            credentials('git-credentials-id')
                          }
                          branch('*/main')
                        }
                      }
                      scriptPath('job-dsl/seed-job-pattern-b.groovy')
                      lightweight(true)
                    }
                  }
                }

    # OpenShift / Kubernetes Ingress Configuration
    ingress:
      enabled: false

    # OpenShift Route support (when deployed on OpenShift)
    route:
      enabled: true
      annotations:
        haproxy.router.openshift.io/timeout: 5m
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  # Persistence settings
  persistence:
    enabled: true
    storageClass: "gp3-csi"
    size: "30Gi"
    accessMode: "ReadWriteOnce"

  # Service Account configuration
  serviceAccount:
    create: true
    name: "jenkins-controller"
    annotations: {}

  serviceAccountAgent:
    create: true
    name: "jenkins-agent"
