# ==============================================================================
# Yamllint Configuration for Enterprise CI/CD Inventories & Configs
# Repository: github.com/nubenetes/jenkins-backstage-gitops-patterns
# File: .yamllint.yml
# ==============================================================================
---
extends: default

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    check-keys: false
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: true
