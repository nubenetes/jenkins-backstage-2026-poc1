# ==============================================================================
# ArgoCD 3.5 Modern Declarative Application Specification
# Repository: github.com/nubenetes/jenkins-backstage-gitops-patterns
# File: gitops/argocd/application.yaml
# ==============================================================================
# Bridges Jenkins Pattern B CI pipeline output with ArgoCD 3.5 continuous delivery.
# Configured with Server-Side Apply, automated self-healing, sync waves, and pruning.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-gateway-dev
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: store-gateway
    app.kubernetes.io/part-of: e-commerce
    app.kubernetes.io/managed-by: argocd-3.5
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/tracking-id: "store-gateway-dev:apps/Deployment:apps-dev/store-gateway"
spec:
  project: default
  source:
    repoURL: https://github.com/nubenetes/jenkins-backstage-gitops-patterns.git
    targetRevision: main
    path: charts/jenkins-wrapper
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
