# ==============================================================================
# Microservice Catalog Info Template (Generated by Backstage Scaffolder)
# Repository: github.com/nubenetes/jenkins-backstage-2026-poc1
# File: backstage/templates/catalog-info-template.yaml
# ==============================================================================
# This template is embedded into new microservices generated by Backstage.
# It automatically binds live Jenkins build widgets, SonarQube quality metrics,
# and OpenShift deployment links into the developer portal entity page.
# ==============================================================================
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.title | default(values.name) }}
  description: ${{ values.description | default("Spring Boot 3 Java 21 microservice managed by Pattern B GitOps CI/CD.") }}
  annotations:
    github.com/project-slug: ${{ values.owner }}/${{ values.name }}
    jenkins.io/job-full-name: dev/${{ values.teamName }}/${{ values.name }}
    sonarqube.org/project-key: ${{ values.name }}-dev
    backstage.io/techdocs-ref: dir:.
    openshift.io/namespace: apps-dev
    prometheus.io/rule: alert:HighErrorRate
  tags:
    - spring-boot
    - java-21
    - microservice
    - ${{ values.teamName }}
    - pattern-b
spec:
  type: service
  lifecycle: experimental
  owner: group:${{ values.teamName }}
  system: ${{ values.system | default("core-banking") }}
  providesApis:
    - ${{ values.name }}-api
